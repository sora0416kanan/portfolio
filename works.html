    const galleryEl = document.getElementById("worksGallery");
    const filterButtons = document.querySelectorAll(".filter-btn");

    // ポップアップ要素
    const modalEl = document.getElementById("workModal");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalClose = document.getElementById("modalClose");
    const modalMedia = document.getElementById("modalMedia");
    const modalCategory = document.getElementById("modalCategory");
    const modalTitle = document.getElementById("modalTitle");
    const modalMeta = document.getElementById("modalMeta");
    const modalDesc = document.getElementById("modalDesc");

    function renderGallery(filter = "all") {
      galleryEl.innerHTML = "";

      const filteredItems =
        filter === "all"
          ? worksData
          : worksData.filter((item) => item.category === filter);

      filteredItems.forEach((item) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "work-card";
        card.setAttribute("aria-label", `${item.title} の詳細を見る`);

        const stage = document.createElement("div");
        stage.className = "work-card-stage";

        const fallback = document.createElement("div");
        fallback.className = "work-card-fallback";
        fallback.textContent = "読み込み中...";

        if (item.type === "video") {
          const video = document.createElement("video");
          video.className = "work-card-media";
          video.src = item.src;
          video.muted = true;
          video.loop = true;
          video.playsInline = true;
          video.preload = "metadata";

          const showVideo = () => stage.classList.add("has-media");
          video.addEventListener("loadedmetadata", showVideo);
          video.addEventListener("loadeddata", showVideo);
          video.addEventListener("canplay", showVideo);
          if (video.readyState >= 1) {
            showVideo();
          }

          card.addEventListener("mouseenter", () => video.play().catch(() => {}));
          card.addEventListener("mouseleave", () => {
            video.pause();
            video.currentTime = 0;
          });
          stage.appendChild(video);
        } else if (item.type === "web") {
          const previewWrap = document.createElement("div");
          previewWrap.className = "work-card-web-preview";

          const iframe = document.createElement("iframe");
          iframe.src = item.src;
          iframe.title = item.title;
          iframe.tabIndex = -1;

          previewWrap.appendChild(iframe);
          stage.classList.add("has-media");
          stage.appendChild(previewWrap);

          const updateScale = () => {
            const stageWidth = stage.clientWidth;
            if (stageWidth > 0) {
              iframe.style.transform = `scale(${stageWidth / 1280})`;
            }
          };
          requestAnimationFrame(updateScale);
          window.addEventListener("resize", updateScale);
        } else {
          const img = document.createElement("img");
          img.className = "work-card-media";
          img.alt = item.title;

          const showImg = () => stage.classList.add("has-media");
          img.addEventListener("load", showImg);
          img.addEventListener("error", () => {
            fallback.textContent = "画像が見つかりません";
            stage.classList.remove("has-media");
          });
          img.src = item.src;

          if (img.complete && img.naturalWidth > 0) {
            showImg();
          }
          stage.appendChild(img);
        }

        stage.appendChild(fallback);
        card.appendChild(stage);
        card.addEventListener("click", () => openModal(item));
        galleryEl.appendChild(card);
      });
    }

    function openModal(item) {
      modalMedia.innerHTML = "";

      if (item.type === "video") {
        const video = document.createElement("video");
        video.src = item.src;
        video.controls = true;
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        modalMedia.appendChild(video);
      } else if (item.type === "web") {
        const webWrap = document.createElement("div");
        webWrap.className = "work-modal-web-wrap";

        const iframe = document.createElement("iframe");
        iframe.src = item.src;
        iframe.title = item.title;
        webWrap.appendChild(iframe);

        const openLink = document.createElement("a");
        openLink.href = item.src;
        openLink.target = "_blank";
        openLink.rel = "noopener noreferrer";
        openLink.className = "work-modal-web-link";
        openLink.textContent = "別タブでサイト全体を開く ↗";
        webWrap.appendChild(openLink);

        modalMedia.appendChild(webWrap);
      } else {
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.title;
        img.addEventListener("error", () => {
          modalMedia.innerHTML = `<div class="work-modal-placeholder">${item.title}</div>`;
        });
        modalMedia.appendChild(img);
      }

      modalCategory.textContent = item.categoryLabel;
      modalTitle.textContent = item.title;
      modalMeta.textContent = item.meta;
      modalDesc.textContent = item.description;

      modalEl.classList.add("is-open");
      modalEl.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const playingVideo = modalMedia.querySelector("video");
      if (playingVideo) {
        playingVideo.pause();
      }
      modalEl.classList.remove("is-open");
      modalEl.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderGallery(btn.dataset.filter);
      });
    });

    modalClose.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", closeModal);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalEl.classList.contains("is-open")) {
        closeModal();
      }
    });

    // 初期表示
    renderGallery("all");
  </script>
